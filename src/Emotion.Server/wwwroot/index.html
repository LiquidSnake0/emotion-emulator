<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Emulator</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Le bandeau sert au reglage, jamais a la projection. Touche H pour le cacher. */
  #hud {
    position: fixed; left: 0; top: 0; right: 0;
    display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; align-items: baseline;
    padding: .6rem 1rem;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9aa0a6; background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
    user-select: none;
  }
  #hud b { color: #e8eaed; font-weight: 600; }
  #hud .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; background: #444; }
  #hud.off { display: none; }

  /* Le bouton de mode. Assez visible pour se trouver dans le noir d'un club, assez
     sobre pour ne pas attirer l'oeil quand le bandeau reste ouvert par megarde. */
  #mode {
    font: inherit; cursor: pointer;
    padding: .2rem .7rem; border-radius: 999px;
    border: 1px solid #3c4043; background: #202124; color: #9aa0a6;
  }
  #mode:hover { border-color: #5f6368; color: #e8eaed; }
  #mode[data-mode="1"] { border-color: #ffd23c; color: #ffd23c; }
  #mode[data-mode="2"] { border-color: #34a853; color: #34a853; }
</style>
</head>
<body>
<div id="hud">
  <span><span class="dot" id="link"></span> <span id="state">connexion…</span></span>
  <span>source <b id="src">—</b></span>
  <span>bpm <b id="bpm">—</b></span>
  <span>face <b id="side">—</b></span>
  <span>camelot <b id="camelot">—</b></span>
  <span>scene <b id="scene">—</b></span>
  <span id="title">—</span>
  <span>au casque <b id="cued">—</b> <b id="cuepret">—</b></span>
  <span>fondu <b id="blend">—</b></span>
  <button id="mode" type="button">visuel</button>
  <span style="margin-left:auto">S cycle · D diagnostic · H masque · F plein ecran</span>
</div>
<canvas id="stage"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
